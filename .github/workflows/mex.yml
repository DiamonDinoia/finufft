name: Build MATLAB MEX

on:
  # Weekly schedule (Sunday 00:00 UTC)
  schedule:
    - cron: "0 0 * * 0"

  # On tag push
  push:
    tags:
      - 'v*'
  # Manual trigger (with an optional deploy toggle)
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after build?"
        type: boolean
        required: false
        default: false
jobs:
  mex:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
          - os: windows-2025
            # CUDA 12.4's nvcc rejects VS2026's v145 (_MSC_VER >= 1950); the image
            # carries the v143 toolset side-by-side, so select it
            msvc_toolset: '14.44'
#         - os: macos-13 this requires matlab openmp to work.
          - os: macos-15
            osx_arch: arm64
            xcode_version: '16.4'
          - os: macos-26
            osx_arch: arm64
          - os: macos-15-intel
            osx_arch: x86_64
            xcode_version: '16.4'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # mac runners have hung inside MATLAB startup (the mexext probe) for hours;
    # cap the job and the quick probe step separately so a hang turns red
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1
        with:
          cmake: true
          ninja: true
          vcvarsall: true
      - name: Select MSVC toolset (where pinned per cell)
        if: ${{ matrix.msvc_toolset }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ matrix.msvc_toolset }}
      - name: Select Xcode (per-cell pin; unset cells keep the image default)
        if: ${{ runner.os == 'macOS' && matrix.xcode_version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode_version }}
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcodebuild -version
          # brew libomp supplies omp.h and the -fopenmp flags AppleClang needs;
          # matlab/CMakeLists.txt then swaps the runtime for the copy MATLAB
          # bundles. Never put brew's libomp on DYLD_LIBRARY_PATH: MATLAB loads it
          # ahead of its own and wedges on maca64 (run 33508066886).
          brew install fftw libomp
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> $GITHUB_ENV
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> $GITHUB_ENV
          ver="${{ matrix.os }}"; ver="${ver#macos-}"; ver="${ver%%-*}"
          echo "MACOSX_DEPLOYMENT_TARGET=${ver}.0" >> "$GITHUB_ENV"

      # Install CUDA on non-macOS runners
      - name: Install CUDA Toolkit (non-macOS)
        if: runner.os != 'macOS'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.4.0'
          method: 'network'
          linux-local-args: '["--toolkit"]'
          log-file-suffix: '${{matrix.os}}-cuda-install.txt'
          sub-packages: ${{runner.os == 'Linux' && '["nvcc", "cudart"]' || '["nvcc", "cudart", "cufft", "cufft_dev"]'}}
          non-cuda-sub-packages: ${{runner.os == 'Linux' && '["libcufft","libcufft-dev"]' || '[]'}}
          use-local-cache: 'false'
          use-github-cache: 'false' #it is not working at the moment https://github.com/Jimver/cuda-toolkit/issues/390

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023b
          products: Parallel_Computing_Toolbox
          cache: false
      - name: Configure & Build
        shell: bash
        run: |
          # Ensure MATLAB is on PATH if provided by setup-matlab
          if [ -n "${MATLAB_ROOT:-}" ]; then export PATH="${MATLAB_ROOT}/bin:${PATH}"; fi

          # MEXEXT is a function of the matrix, not something MATLAB must tell us
          # (a MATLAB-booting detect step also hangs intermittently on maca64)
          if [ "${RUNNER_OS}" = "Linux" ]; then
            MEXEXT=mexa64; MATLAB_ARCH_DIR=glnxa64
          elif [ "${RUNNER_OS}" = "Windows" ]; then
            MEXEXT=mexw64; MATLAB_ARCH_DIR=win64
          elif [ "${{ matrix.osx_arch }}" = "x86_64" ]; then
            MEXEXT=mexmaci64; MATLAB_ARCH_DIR=maci64
          else
            MEXEXT=mexmaca64; MATLAB_ARCH_DIR=maca64
          fi
          echo "MEXEXT=$MEXEXT" >> "$GITHUB_ENV"
          echo "MEXEXT=$MEXEXT, MATLAB_ARCH_DIR=$MATLAB_ARCH_DIR"

          # Enable CUDA if not macOS
          CUDA_FLAG=""
          if [ "${RUNNER_OS}" != "macOS" ]; then
            CUDA_FLAG="-DFINUFFT_USE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=50;60;70;80;89"
          fi

          # On macOS, target the per-cell CMAKE_OSX_ARCHITECTURES from the matrix
          EXTRA_MACOS_FLAGS=""
          if [ "${RUNNER_OS}" = "macOS" ]; then
          EXTRA_MACOS_FLAGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}"
          fi

          # The packaged MEX runs on machines other than the builder, so target a
          # baseline ISA and never the builder's own: an /arch:AVX512 build died
          # with an illegal instruction on the Zen 3 consume runner (windows-2022,
          # run 33534146217). Same policy as the wheels, python/finufft/pyproject.toml.
          ARCH_FLAG="-DFINUFFT_ARCH_FLAGS="
          if [ "${RUNNER_OS}" = "Linux" ] || [ "${{ matrix.osx_arch }}" = "x86_64" ]; then
            ARCH_FLAG="-DFINUFFT_ARCH_FLAGS=-march=x86-64"
          fi

          DUCC0_FLAG="-DFINUFFT_USE_DUCC0=ON"

          cmake --preset matlab -B build \
            ${EXTRA_MACOS_FLAGS} \
            ${ARCH_FLAG} \
            ${DUCC0_FLAG} \
            -DMatlab_MEX_EXTENSION="${MEXEXT}" \
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>" \
            ${CUDA_FLAG}

          cmake --build build --verbose --target finufft_mex --parallel

          if [ "${RUNNER_OS}" != "macOS" ]; then
            cmake --build build --verbose --target cufinufft_mex --parallel
          fi

      - name: Inspect finufft MEX OpenMP dependency (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          MEX="build/matlab/finufft.${MEXEXT}"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            otool -L "${MEX}" | tee deps.txt
          else
            ldd "${MEX}" | tee deps.txt
          fi
          # The MEX must use the OpenMP runtime inside MATLAB and no other. A second
          # runtime in the MATLAB process aborts on mac (OMP #15 / #179) and corrupts
          # the heap when R2024b or newer unloads the MEX on Linux. R2023b, which this
          # workflow installs, survives the Linux case, so only this check catches it.
          if grep -qE 'libgomp|(/opt/homebrew|/usr/local)/.*lib(omp|iomp5)' deps.txt; then
            echo "::error::MEX depends on a non-MATLAB OpenMP runtime"
            exit 1
          fi
          if [ "$(grep -cE 'lib(omp|iomp5)[^/]*\.(dylib|so)' deps.txt)" -gt 1 ]; then
            echo "::error::MEX depends on more than one OpenMP runtime"
            exit 1
          fi

      - name: Inspect cufinufft MEX dynamic dependencies
        if: runner.os != 'macOS'
        shell: bash
        run: |
          # matlab/CMakeLists.txt defines cufinufft_mex via matlab_add_mex with
          # OUTPUT_NAME cufinufft and no output-dir override, so with `-B build` the
          # artifact lands at build/matlab/cufinufft.${MEXEXT}
          MEX="build/matlab/cufinufft.${MEXEXT}"
          if [ ! -f "${MEX}" ]; then
            echo "::error::Expected cufinufft MEX artifact missing: ${MEX}"
            exit 1
          fi
          echo "Dynamic dependents of ${MEX}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            # dumpbin is not on the default PATH; locate it via vswhere (CRLF-stripped)
            DUMPBIN="$(vswhere -latest -products '*' -find '**/dumpbin.exe' | head -1 | tr -d '\r')"
            if [ -z "${DUMPBIN}" ]; then
              echo "::error::dumpbin not found via vswhere"
              exit 1
            fi
            echo "Using dumpbin: ${DUMPBIN}"
            # dash form: MSYS2 rewrites /dependents into a path for native exes
            "${DUMPBIN}" -dependents "${MEX}" | tee deps.txt
          else
            ldd "${MEX}" | tee deps.txt
          fi
          # the driver (nvcuda/libcuda.so) loads at runtime; hard-linking it is a defect
          if grep -qiE 'nvcuda|libcuda\.so' deps.txt; then
            echo "::error::cufinufft MEX hard-links the CUDA driver library"
            exit 1
          fi

      - name: Verify cufinufft MEX loads in MATLAB (no GPU)
        if: runner.os != 'macOS'
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(genpath('matlab'));
            addpath('build/matlab');
            assert(exist('cufinufft')==3, 'cufinufft MEX not found on the MATLAB path');
            cufinufft

      - name: Run matlab math & tol-sweep tests
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(genpath('matlab'));
            addpath(genpath('build'));
            fullmathtest
            tolsweeptest

      - name: Package with CPack
        shell: bash
        run: cmake --build build --target package

      - uses: actions/upload-artifact@v7
        with:
          name: finufft-matlab-mex-${{ matrix.os }}
          path: |
            build/*.zip
            build/*.tar.gz
          if-no-files-found: error

  # Consume the packaged MEX on a fresh runner that has ONLY MATLAB: no cmake,
  # brew, CUDA or any build tooling. This is what a user machine looks like.
  consume:
    needs: mex
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
          - os: windows-2025
          - os: macos-15
          - os: macos-26
          - os: macos-15-intel
    name: consume-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7  # only for matlab/test; the binaries come from the artifact

      - uses: actions/download-artifact@v8
        with:
          name: finufft-matlab-mex-${{ matrix.os }}
          path: dl

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023b
          products: Parallel_Computing_Toolbox
          cache: false

      - name: Unpack the artifact (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dl/x
          tar xzf dl/*.tar.gz -C dl/x
          ls dl/x/matlab | head -5
          ls dl/x/matlab/*.mex* || { echo "::error::artifact carries no MEX binary"; exit 1; }

      - name: Unpack the artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive dl\*.zip -DestinationPath dl\x
          Get-ChildItem dl\x\matlab | Select-Object -First 5
          if (-not (Get-ChildItem dl\x\matlab\*.mex* -ErrorAction SilentlyContinue)) { throw "artifact carries no MEX binary" }

      - name: Test the packaged MEX
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(genpath('matlab'));          % test scripts only
            addpath(genpath(fullfile('dl','x','matlab')));  % the packaged MEX + .m wrappers
            fullmathtest
            tolsweeptest
