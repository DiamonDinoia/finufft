name: DIAG live matlab-omp workbench

on:
  workflow_dispatch:

concurrency:
  group: diag-omp-live
  cancel-in-progress: true

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            osx_arch: arm64
            pin_xcode: '16.4'
          - os: macos-15-intel
            osx_arch: x86_64
            pin_xcode: '16.4'
          - os: macos-26
            osx_arch: arm64
            pin_xcode: ''
    name: bench-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1
        with:
          cmake: true
          ninja: true

      - uses: maxim-lobanov/setup-xcode@v1
        if: ${{ matrix.pin_xcode }}
        with:
          xcode-version: ${{ matrix.pin_xcode }}

      - name: brew deps
        shell: bash
        run: brew install fftw libomp

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023b
          products: Parallel_Computing_Toolbox
          cache: false

      - name: Build the MEX (openmp on, ducc0 on) to have artifacts in place
        shell: bash
        run: |
          if [ -n "${MATLAB_ROOT:-}" ]; then export PATH="${MATLAB_ROOT}/bin:${PATH}"; fi
          cmake --preset matlab -B build \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }} \
            -DFINUFFT_USE_DUCC0=ON \
            -DFINUFFT_USE_OPENMP=ON || true
          cmake --build build --target finufft_mex --parallel || true
          ls -la build/matlab/ 2>/dev/null | head

      - name: tmate workbench (SSH string in this step's log)
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 120
        with:
          timeout-minutes: 120
