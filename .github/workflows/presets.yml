# Every preset no other workflow configures, configured from CMakePresets.json
# itself. A preset is a promise in the documentation, and the way one breaks is
# quiet: a renamed option, an inherits chain that no longer resolves, a
# generator the file names and nobody installed. Configuring catches all three,
# and the build matrix in cmake_ci.yml already covers what the configurations
# then compile to, so only the end-user preset is built here.
#
# Seven presets are absent. dev, sanitizers and static-analysis are configured
# by cmake_ci.yml and valgrind.yml, cmake_sanitizers.yml and static_analysis.yml
# on the same push and pull_request events, and a second cell would only buy a
# second toolchain to keep working. matlab needs MATLAB, and mex.yml configures
# and builds it where MATLAB exists. gpu and all ask CMake for
# CMAKE_CUDA_ARCHITECTURES=native, which needs a device the runners do not have,
# so the Jenkins GPU pods configure those (see Jenkinsfile, stage 'install
# cuda'). gpu-perlmutter names the Cray compiler wrappers and can only be
# configured on that machine.
#
# fortran stays here even though fortran.yml configures it: that workflow has no
# pull_request trigger, so a pull request from a fork would test the preset
# nowhere.
name: cmake presets

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    name: preset ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [default, dev-ducc, ninja-multi, fortran, docs, dev-docs, gpu-fat, all-wrappers]
    steps:
      - uses: actions/checkout@v7

      # The same toolchain steps the rest of CI uses: setup-cpp for cmake and
      # ninja, setup-python where a preset needs the docs requirements, and apt
      # only for what those actions do not carry, which is libraries and
      # gfortran.
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          cmake: true
          ninja: true

      - name: Set up Python
        if: matrix.preset == 'docs' || matrix.preset == 'dev-docs'
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install what the preset asks for
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev
          case "${{ matrix.preset }}" in
          fortran | all-wrappers) sudo apt-get install -y gfortran ;;
          docs | dev-docs) python -m pip install -r docs/requirements.txt ;;
          esac

      # A toolkit, no device. gpu-fat is the preset for exactly that machine: it
      # names all-major rather than native, so it configures without one.
      - name: CUDA toolkit
        if: matrix.preset == 'gpu-fat'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          method: network
          sub-packages: '["nvcc", "cudart"]'
          non-cuda-sub-packages: '["libcufft", "libcufft-dev"]'

      # all-wrappers turns on the MATLAB interface, and no runner here has
      # MATLAB. Naming the option off is what keeps the rest of the preset under
      # test rather than dropping the whole cell.
      - name: Configure
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ matrix.preset }}" = "all-wrappers" ]; then
            extra=(-DFINUFFT_BUILD_MATLAB=OFF -DFINUFFT_MATLAB_INSTALL=OFF)
          fi
          cmake --preset "${{ matrix.preset }}" "${extra[@]}"

      # The one preset an end user is told to run first, so it is the one that
      # has to produce a library and not only a build directory.
      - name: Build
        if: matrix.preset == 'default'
        run: cmake --build --preset default
