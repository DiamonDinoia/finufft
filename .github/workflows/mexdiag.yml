name: diag matlab mex heap

# Throwaway diagnostic for the ubuntu-22.04 MATLAB MEX failure in run 33551928063.
# Run 33650265224 named the defect: AddressSanitizer heap-buffer-overflow at
# spread.hpp:684, bin_sort_multithread_impl<double,1> indexing a 76-bin histogram
# with 92, on the first double-precision transform of fullmathtest. Valid
# coordinates cannot produce that index, and the same code is clean locally
# (gcc 14, libgomp or MATLAB's libiomp5, SSE2, asan).
#
# Jobs: `probe` runs the same shape without MATLAB, so the image's gcc 11 and
# MATLAB's OpenMP runtime are separated; `mexdiag` runs the MEX with the
# FINUFFT_BINSORT_DIAG report compiled in, which prints the coordinate and the
# bin bounds that produced the out-of-range index.
# Delete this file once the cause is fixed.

on:
  workflow_dispatch:
  push:
    branches: [diag/mex-heap]

jobs:
  probe:
    name: probe-${{ matrix.arm }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: gomp
            preload: ''
          - arm: iomp5
            preload: matlab
    steps:
      - uses: actions/checkout@v7

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1
        with:
          cmake: true
          ninja: true

      - name: Set up MATLAB
        if: matrix.preload == 'matlab'
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023b
          cache: false

      - name: Build the library with the bin-sort report
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFINUFFT_ARCH_FLAGS=-march=x86-64 \
            -DFINUFFT_USE_DUCC0=ON \
            -DFINUFFT_BUILD_TESTS=OFF \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer -g -DFINUFFT_BINSORT_DIAG"
          cmake --build build --target finufft --parallel
          g++ --version

      - name: Run the fullmathtest shape without MATLAB
        shell: bash
        run: |
          cat > repro.cpp <<'EOF'
          // matlab/test/fullmathtest.m's first double case: 1D types 1 and 2,
          // M=1000, N=1000, ntrans=20, tol=1e-9, x uniform on [0,2pi].
          #include <finufft.h>
          #include <complex>
          #include <cstdio>
          #include <cstdlib>
          #include <random>
          #include <vector>
          int main(int argc, char **argv) {
            const int64_t M = 1000, N = 1000, ntr = 20;
            const int reps = argc > 1 ? atoi(argv[1]) : 20;
            std::mt19937_64 rng(1);
            std::uniform_real_distribution<double> u(0.0, 2 * M_PI);
            std::vector<double> x(M);
            std::vector<std::complex<double>> c(M * ntr), f(N * ntr);
            for (int r = 0; r < reps; ++r) {
              for (auto &v : x) v = u(rng);
              for (auto &v : c) v = {u(rng), u(rng)};
              for (int type : {1, 2}) {
                finufft_opts o;
                finufft_default_opts(&o);
                finufft_plan p;
                if (finufft_makeplan(type, 1, (int64_t *)&N, 1, ntr, 1e-9, &p, &o)) return 2;
                if (finufft_setpts(p, M, x.data(), nullptr, nullptr, 0, nullptr, nullptr,
                                   nullptr))
                  return 3;
                if (finufft_execute(p, type == 1 ? c.data() : f.data(),
                                    type == 1 ? f.data() : c.data()))
                  return 4;
                finufft_destroy(p);
              }
            }
            printf("REPOK reps=%d\n", reps);
            return 0;
          }
          EOF
          g++ -O2 -g -fsanitize=address -fsanitize=undefined -fopenmp -Iinclude repro.cpp \
            -o repro build/src/libfinufft.a build/src/common/libfinufft_common.a \
            build/src/libducc0.a
          PRE=""
          if [ "${{ matrix.preload }}" = matlab ]; then
            # The MEX runs on the OpenMP runtime MATLAB has already initialized, so
            # preload it here (asan first, as its runtime requires).
            PRE="$(gcc -print-file-name=libasan.so):$(ls "${MATLAB_ROOT}"/sys/os/glnxa64/libiomp5.so)"
          fi
          for t in 2 4 8 16; do
            echo "===== OMP_NUM_THREADS=$t preload=${PRE:-none}"
            LD_PRELOAD="$PRE" OMP_NUM_THREADS=$t \
              ASAN_OPTIONS=detect_leaks=0:print_stacktrace=1 ./repro 20
          done

  mexdiag:
    name: mexdiag-${{ matrix.arm }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arm: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Setup C++ toolchain
        uses: aminya/setup-cpp@v1
        with:
          cmake: true
          ninja: true

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023b
          products: Parallel_Computing_Toolbox
          cache: false

      - name: Configure & build the MEX with the bin-sort report
        shell: bash
        run: |
          if [ -n "${MATLAB_ROOT:-}" ]; then export PATH="${MATLAB_ROOT}/bin:${PATH}"; fi
          cmake --preset matlab -B build \
            -DFINUFFT_ARCH_FLAGS=-march=x86-64 \
            -DFINUFFT_USE_DUCC0=ON \
            -DMatlab_MEX_EXTENSION=mexa64 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address -fsanitize=undefined -fno-omit-frame-pointer -g -DFINUFFT_BINSORT_DIAG"
          cmake --build build --target finufft_mex --parallel
          # MATLAB starts before the MEX loads, so the runtimes must be preloaded
          # into the process; the image's gcc decides the soname.
          echo "LD_PRELOAD=$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)" >> "$GITHUB_ENV"

      # The binary resolves the crash-dump offsets and the test step below is
      # expected to kill MATLAB, so upload before running it.
      - name: Upload the MEX
        uses: actions/upload-artifact@v7
        with:
          name: mex-diag-${{ matrix.arm }}
          path: build/matlab/finufft.mexa64
          if-no-files-found: error

      # continue-on-error only defers the verdict: the crash is the thing being
      # diagnosed, so the next step reads the reports first and then re-raises
      # this step's own status.
      - name: Run fullmathtest
        id: test
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        env:
          OMP_NUM_THREADS: '4'
          ASAN_OPTIONS: detect_leaks=0:new_delete_type_mismatch=0:alloc_dealloc_mismatch=0:halt_on_error=0:abort_on_error=0:protect_shadow_gap=0:print_stacktrace=1:log_path=asan.report
          UBSAN_OPTIONS: print_stacktrace=1:log_path=ubsan.report
        with:
          command: |
            addpath(genpath('matlab'));
            addpath('build/matlab');
            fullmathtest
            tolsweeptest

      - name: Report the sanitizer reports and the crash dump
        if: always()
        shell: bash
        run: |
          echo "test step outcome: ${{ steps.test.outcome }}"
          shopt -s nullglob
          for f in asan.report.* ubsan.report.*; do
            echo "===== $f ====="
            cat "$f"
          done
          for d in matlab_crash_dump.* /tmp/matlab_crash_dump.* "$HOME"/matlab_crash_dump.*; do
            echo "===== $d ====="
            cat "$d"
            echo "----- finufft.mexa64 frames resolved -----"
            # MATLAB prints "<path>+<decimal offset>" per frame
            grep -oE 'finufft\.mexa64\+[0-9]+' "$d" | sort -u | while read -r frame; do
              off=${frame##*+}
              printf '%s -> ' "$frame"
              addr2line -f -C -i -e build/matlab/finufft.mexa64 "$(printf '0x%x' "$((10#$off))")"
            done
          done
          # The verdict is the test step's own status, reported after the diagnosis.
          [ "${{ steps.test.outcome }}" = "success" ]

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-diag-${{ matrix.arm }}
          path: |
            asan.report.*
            ubsan.report.*
            matlab_crash_dump.*
          if-no-files-found: ignore
