# Consume FINUFFT the way somebody outside this repository does: over the
# network, from GitHub. cmake_ci.yml and quick-start.yml both hand the consumers a
# local source directory, so the clone, the source archive and the published
# wheel are paths no other workflow walks.
#
# The checkout supplies the consumer projects under examples/quick-start and
# nothing else. FINUFFT itself always arrives from GitHub: cloned by FetchContent
# and CPM, or unpacked from the source archive.
#
# Two events, two questions. On a schedule or a release it consumes the published
# release, where most failures come from the world moving rather than from a
# commit here. On a pull request that touches packaging it consumes that pull
# request's own head — the wheel route pins the latest release instead, since no
# wheel exists for a commit — which both checks the change and proves this
# workflow still runs; a cron-only workflow that has never executed is one
# nobody knows is broken.
name: released package

on:
  schedule:
    # Mondays, off the hour: scheduled jobs on the hour queue behind everyone
    # else's.
    - cron: "17 6 * * 1"
  release:
    types: [published]
  pull_request:
    # Only what this workflow consumes or reads. A pull request that touches
    # neither the package nor the consumers cannot change the answer, and would
    # pay three full builds for it.
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "examples/quick-start/**"
      - ".github/workflows/release_consume.yml"
      # export-ignore rules here are the only source of a checkout/archive delta,
      # which is what the tarball route exists to catch.
      - ".gitattributes"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to consume (default: the latest release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.pick.outputs.repo }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - name: Pick what to consume
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          # The pull request head by sha, not its branch name: a name resolves
          # at clone time, so a force-push mid-run would land the FetchContent
          # and CPM clones and the tarball download on different commits. The
          # merge ref is no alternative: it exists only in this repository's
          # refs/pull namespace, and a clone cannot reach it. On non-PR events
          # this expands to an empty string and the else branch below wins.
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_REF:-}" ]; then
            repo="$PR_REPO"
            ref="$PR_REF"
          else
            repo="$GITHUB_REPOSITORY"
            ref="${INPUT_TAG:-${EVENT_TAG:-}}"
            # A dispatch tag typed without the leading v names that release anyway: 2.5.1 means v2.5.1.
            [[ "$ref" =~ ^[0-9] ]] && ref="v$ref"
            if [ -z "$ref" ]; then
              # Releases, like the PyPI wheels, live in the upstream repository;
              # $GITHUB_REPOSITORY on a fork has none and the lookup 404s.
              ref=$(gh api "repos/flatironinstitute/finufft/releases/latest" -q .tag_name)
            fi
          fi
          echo "repo=$repo" >>"$GITHUB_OUTPUT"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          echo "consuming $repo at $ref"

  cmake:
    needs: target
    name: ${{ matrix.route }} ${{ needs.target.outputs.ref }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every event runs every platform. A cell is one FINUFFT build, which
        # the consume cells in quick-start.yml measure at 52-168 s against a
        # compiler matrix in cmake_ci.yml of 8-30 min per cell that already runs
        # on every pull request, so narrowing the matrix by event would save
        # nothing worth a packaging fault reaching a release.
        # The Windows and macOS images cmake_ci.yml builds on, except that
        # deprecated macos-14 (runner-images #13518) becomes macos-26 here.
        # macos-15-intel is the x86_64 macOS the project ships a wheel for; the
        # other two macOS images are arm64. ubuntu-24.04-arm covers the other
        # architecture #909 names, aarch64 Linux, which no other cell here
        # builds on.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-2025, macos-15, macos-15-intel, macos-26]
        route: [fetchcontent, cpm, tarball]
    steps:
      - uses: actions/checkout@v7

      # Apple clang is not usable here: at -O3 -march=native with the
      # -Xclang -fopenmp that FindOpenMP hands it, Apple clang 17 crashes its own
      # frontend on src/fft.cpp. brew llvm on macOS, msvc on Windows, as in
      # quick-start.yml.
      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ startsWith(matrix.os, 'macos-') && 'llvm' || (startsWith(matrix.os, 'windows-') && 'msvc' || '') }}
          vcvarsall: ${{ startsWith(matrix.os, 'windows-') }}
          cmake: true
          ninja: true

      # The same libomp recipe as quick-start.yml and cmake_ci.yml: FINUFFT asks
      # for OpenMP with REQUIRED and brew llvm does not put libomp on cmake's
      # search path by itself. No FFTW here, ducc0 is hardcoded below.
      - name: Install libomp (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install libomp
          {
            echo "LDFLAGS=-L$(brew --prefix libomp)/lib"
            echo "CPPFLAGS=-I$(brew --prefix libomp)/include"
            echo "LIBRARY_PATH=$(brew --prefix libomp)/lib"
            echo "DYLD_LIBRARY_PATH=$(brew --prefix libomp)/lib"
            echo "CMAKE_PREFIX_PATH=$(brew --prefix libomp)"
          } >> "$GITHUB_ENV"

      - name: Consume ${{ needs.target.outputs.repo }} at ${{ needs.target.outputs.ref }}
        shell: bash
        env:
          REPO: ${{ needs.target.outputs.repo }}
          REF: ${{ needs.target.outputs.ref }}
        run: |
          set -euo pipefail
          # ducc0 ships with FINUFFT, so no cell needs an FFTW from a package
          # manager and a broken system FFTW cannot be mistaken for a broken
          # package.
          common=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DFINUFFT_USE_DUCC0=ON)
          url="${GITHUB_SERVER_URL}/${REPO}.git"
          case "${{ matrix.route }}" in
          fetchcontent)
            # No FINUFFT_SOURCE_DIR, so the consumer clones the ref itself.
            cmake -S examples/quick-start/fetchcontent -B _b "${common[@]}" \
              -DFINUFFT_GIT_REPOSITORY="$url" -DFINUFFT_GIT_TAG="$REF"
            ;;
          cpm)
            # FINUFFT_SOURCE_DIR only points CPM's bootstrap at cmake/setupCPM.cmake;
            # naming a ref turns off the local redirect, so CPM really clones.
            cmake -S examples/quick-start/cpm -B _b "${common[@]}" \
              -DFINUFFT_SOURCE_DIR="$PWD" \
              -DFINUFFT_GIT_REPOSITORY="$url" -DFINUFFT_GIT_TAG="$REF" \
              -DCPM_SOURCE_CACHE="$PWD/cpm"
            ;;
          tarball)
            # The source archive GitHub serves under "Source code (tar.gz)", which
            # is what a packager downloads. A file that is in the checkout but not
            # in the archive shows up here and nowhere else.
            curl -sSL -o src.tar.gz \
              "${GITHUB_SERVER_URL}/${REPO}/archive/${REF}.tar.gz"
            tar xzf src.tar.gz
            src=$(echo finufft-*/)
            cmake -S "$src" -B _rel "${common[@]}" -DCMAKE_INSTALL_PREFIX="$PWD/_stage"
            cmake --build _rel
            cmake --install _rel
            cmake -S examples/quick-start/find_package -B _b "${common[@]}" \
              -DCMAKE_PREFIX_PATH="$PWD/_stage"
            ;;
          esac
          cmake --build _b
          # Ninja everywhere, so the executable is beside the build directory;
          # only Windows spells it with a suffix.
          if [ -x _b/app.exe ]; then _b/app.exe; else _b/app; fi

  wheel:
    # needs: target for the ref the expected version below resolves from.
    needs: target
    name: pypi wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same set cmake_ci.yml builds on, minus the two platforms #909 is
        # about: master builds macosx x86_64 and manylinux aarch64 wheels but no
        # release has shipped either, so macos-15-intel and ubuntu-24.04-arm
        # could only install the sdist. Add both labels with the first release
        # that carries those wheels; --only-binary below fails the cell if they
        # regress.
        os: [ubuntu-24.04, windows-2022, windows-2025, macos-15, macos-26]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Every cell asserts one exact version, whatever the event: the tag on a
      # release or a tagged dispatch, the latest release on a schedule or a pull
      # request (a pull request target is a commit, and no wheel exists for it).
      # Less than that leaves holes: on workflow_dispatch(tag) an unpinned
      # install tests PyPI-latest instead of the tag, and on a schedule a
      # release whose wheel upload failed resolves an older wheel and stays
      # green — the #909 fault shape, still open.
      - name: Resolve the expected version
        id: expect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.target.outputs.ref }}
        run: |
          set -euo pipefail
          ref="$REF"
          if [[ ! "$ref" =~ ^v[0-9] ]]; then
            # Upstream, not $GITHUB_REPOSITORY: a fork has no releases to find.
            ref=$(gh api "repos/flatironinstitute/finufft/releases/latest" -q .tag_name)
          fi
          echo "expected=${ref#v}" >>"$GITHUB_OUTPUT"
      # The wheel on PyPI, not one built here — --only-binary makes that a gate:
      # without it pip answers a missing wheel by building the sdist and the
      # cell reports green on exactly the fault it exists to catch (#909's
      # missing macosx x86_64 wheel was invisible this way). The wheels for a
      # fresh tag appear minutes after the release, so the pin retries rather
      # than failing on the timing. cufinufft ships wheels for manylinux_x86_64
      # and win_amd64 only, so just those cells gate it too; no import, no card.
      - name: Install and check the published wheels
        shell: bash
        env:
          EXPECTED: ${{ steps.expect.outputs.expected }}
        run: |
          set -euo pipefail
          install_wheel() {
            pkg=$1; shift
            for _ in $(seq 20); do
              if python -m pip install --only-binary="$pkg" "$pkg==$EXPECTED" "$@"; then return 0; fi
              echo "$pkg $EXPECTED is not on PyPI yet; waiting 60 s"
              sleep 60
            done
            echo "$pkg $EXPECTED never appeared on PyPI: the release has no wheel"
            return 1
          }
          assert_version() {
            python -c "import importlib.metadata as m; v = m.version('$1'); print('$1', v); assert v == '$EXPECTED', v"
          }
          python -m pip install --upgrade pip
          install_wheel finufft numpy
          assert_version finufft
          if [[ "$RUNNER_OS" == "Linux" || "$RUNNER_OS" == "Windows" ]]; then
            install_wheel cufinufft
            assert_version cufinufft
          fi
          python - <<'PY'
          import numpy as np, finufft
          rng = np.random.default_rng(0)
          n, m = 32, 100
          x = rng.uniform(-np.pi, np.pi, m)
          c = rng.standard_normal(m) + 1j * rng.standard_normal(m)
          f = finufft.nufft1d1(x, c, n, eps=1e-12, isign=1)
          k = np.arange(-(n // 2), n - n // 2)
          # Pointwise against the direct sum the transform is defined as: a norm
          # or an energy check passes on a permuted or conjugated result.
          ref = np.exp(1j * k[:, None] * x[None, :]) @ c
          err = np.max(np.abs(f - ref)) / np.max(np.abs(ref))
          print("max relative error", err)
          assert err < 1e-10, err
          PY
