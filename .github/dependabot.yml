# The workflows pin action versions by hand; nothing noticed when three fell
# behind: setup-python a major (v6 to v7), the 0.x cuda-toolkit and sccache-action a patch.
#
# Monthly and grouped, so this is one pull request a month rather than one per
# action. Major bumps arrive in the same request; the release notes decide
# whether they land, as setup-python v7 did.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
